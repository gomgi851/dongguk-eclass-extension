<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dongguk e-Class</title><script src="diagnostics.js" defer></script><link rel="icon" type="image/png" href="icons/icon32.png"><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><h1><img class="brand-icon" src="icons/icon48.png" width="32" height="32" alt=""> Dongguk <span class="brand-accent">e-Class</span></h1><label class="theme-switch" title="라이트 / 다크 모드"><input id="theme" type="checkbox" role="switch" aria-label="다크 모드" checked><span class="switch-track" aria-hidden="true"><span class="switch-thumb"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2.1 2.1m11.4 11.4l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 15.3A8.5 8.5 0 0 1 8.7 4.4a8.5 8.5 0 1 0 10.9 10.9Z"/></svg></span></span></label><button id="settings-button" class="icon-button" aria-label="설정" title="설정" aria-haspopup="dialog"><img src="settings.svg" alt="" width="19" height="19"><span id="settings-dot" hidden></span></button></header>
<div class="view-controls"><div class="type-tabs" role="group" aria-label="학습 종류"><button data-kind="과제" aria-pressed="true">과제</button><button data-kind="동영상" aria-pressed="false">동영상</button></div>
<div class="submission-tabs" role="group" aria-label="제출 상태"><button data-submission="pending" aria-pressed="true"><span class="label">미제출</span> <span class="count"></span></button><button data-submission="done" aria-pressed="false"><span class="label">제출함</span> <span class="count"></span></button><button data-submission="all" aria-pressed="false"><span class="label">전체</span> <span class="count"></span></button></div>
</div><div class="meta"><span id="summary"></span><div class="filter-control"><input id="filter" type="hidden" value="all"><button id="filter-toggle" aria-label="기간·상태" aria-haspopup="listbox" aria-expanded="false" aria-controls="filter-menu"><span id="filter-label">모든 기간</span><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><div id="filter-menu" role="listbox" aria-label="기간·상태" hidden><button role="option" data-period="all" aria-selected="true" tabindex="-1">모든 기간</button><button role="option" data-period="active" aria-selected="false" tabindex="-1">기한 내</button><button role="option" data-period="expired" aria-selected="false" tabindex="-1">기한 지남</button><button role="option" data-period="upcoming" aria-selected="false" tabindex="-1">공개 예정</button><button role="option" data-period="unknown" aria-selected="false" tabindex="-1">확인 필요</button></div></div><button id="refresh" aria-label="새로고침" title="새로고침"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12.5 5A5 5 0 1 0 13 9M12.5 1.5V5H9"/></svg></button></div>
<p id="status" role="status" aria-live="polite">강좌를 선택하고 확인하세요.</p>
<button id="attention" class="attention-button" hidden></button>
<a id="login-link" class="settings-site-link" href="https://eclass.dongguk.edu/" target="_blank" rel="noopener" hidden>e-Class 로그인 ↗</a><progress id="scan-progress" aria-label="강좌 확인 진행률" hidden></progress>
<div id="results"></div>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-header"><h2 id="settings-title">설정</h2><button id="close-settings" class="icon-button" aria-label="설정 닫기" title="닫기">×</button></div>
<div class="preference-row"><div><label for="all-weeks">모든 주차 한 번에 보기</label><p class="note">강의실 페이지에 적용</p></div><label class="preference-switch"><input id="all-weeks" type="checkbox" role="switch" aria-label="모든 주차 한 번에 보기"><span aria-hidden="true"></span></label></div>
<p id="font-status" class="note">글꼴 확인 중…</p>
<p class="font-credit">㈜여기어때컴퍼니 제공 잘난체 2 사용<br><a href="licenses/Jalnan-Official-Guide.pdf" target="_blank" rel="noopener">글꼴 저작권·라이선스 원문 ↗</a></p>
<details id="warning-details" hidden><summary id="warning-count"></summary><div id="warnings"></div></details>
<details id="settings"><summary>강좌 설정</summary><div class="settings-actions"><button id="load">강좌 불러오기</button><button id="scan" disabled>선택 강좌 확인</button><button id="stop" disabled>중지</button></div><p id="settings-status" class="note" role="status" aria-live="polite"></p><a id="settings-login" class="settings-site-link" href="https://eclass.dongguk.edu/" target="_blank" rel="noopener" hidden>e-Class 로그인 ↗</a><div id="courses"></div><p class="note">팝업을 닫아도 확인이 이어집니다.</p><button id="clear" class="text-button">저장 정보 지우기</button><p class="note">퀴즈·설문 제외 · 이 기기에만 저장</p></details>
<details id="runtime-diagnostics"><summary>실행 정보</summary><p id="runtime-version" class="note"></p><p id="csp-status" class="note" role="status"></p><p id="csp-details" class="note"></p></details>
<a class="settings-site-link" href="changelog.html" target="_blank" rel="noopener">업데이트 내역 · v0.7.4 ↗</a>
<a class="settings-site-link" href="https://eclass.dongguk.edu/" target="_blank" rel="noopener">강의실 열기 ↗</a></dialog>
</main><script type="module" src="dashboard.js"></script></body></html>
